<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Baku Mobility Twin — buses and bicycles</title>
<meta name="description" content="A digital twin of Baku's bus network and bike lanes: mirror the network, monitor the moment, understand the gaps, and test decisions before the city pays for them.">
<link rel="icon" type="image/svg+xml" href="__ICON_SVG_URI__">
<link rel="icon" type="image/png" sizes="32x32" href="__ICON_32_URI__">
<link rel="apple-touch-icon" sizes="180x180" href="__ICON_180_URI__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* ============================================================================ tokens
   one type scale (11 12 13 14 16 20 24 32), one spacing scale (4 8 12 16 24 32), one radius and shadow set */
:root{
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rp:999px;
  --ink:#0f172a;--ink2:#475569;--ink3:#64748b;--ink4:#94a3b8;
  --hair:rgba(15,23,42,.09);--hair2:rgba(15,23,42,.055);
  --glass:rgba(255,255,255,.80);--raise:rgba(255,255,255,.97);--sunk:rgba(15,23,42,.045);
  --sh1:0 1px 2px rgba(15,23,42,.07);
  --sh2:0 14px 36px -8px rgba(15,23,42,.18),0 3px 10px rgba(15,23,42,.06);
  --chip:rgba(15,23,42,.05);--chip2:rgba(15,23,42,.09);--on:#0f172a;--on-ink:#fff;
  --accent:#c2620a;--accent-soft:rgba(217,119,6,.12);--accent-line:#e58a00;
  --bike:#047857;--bike-soft:rgba(5,150,105,.12);--violet:#6d28d9;--violet-soft:rgba(124,58,237,.11);
  --danger:#c81e1e;--danger-soft:rgba(220,38,38,.09);--ok:#047857;--warn:#a16207;--warn-soft:rgba(217,119,6,.11);
  --info:#0369a1;--info-soft:rgba(2,132,199,.10);
  --track:rgba(15,23,42,.10);--nightband:rgba(30,41,59,.075);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#e8eef8;--ink2:#a9b6ca;--ink3:#7f8da5;--ink4:#5d6a82;
  --hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.055);
  --glass:rgba(11,16,29,.74);--raise:rgba(17,24,41,.96);--sunk:rgba(255,255,255,.04);
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 18px 44px -10px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.04) inset;
  --chip:rgba(255,255,255,.06);--chip2:rgba(255,255,255,.11);--on:#e8eef8;--on-ink:#0b1220;
  --accent:#ffb84d;--accent-soft:rgba(255,176,32,.14);--accent-line:#ffb020;
  --bike:#4ee8b4;--bike-soft:rgba(52,227,168,.12);--violet:#b9a3ff;--violet-soft:rgba(167,139,250,.14);
  --danger:#ff8a8a;--danger-soft:rgba(248,113,113,.13);--ok:#4ee8b4;--warn:#fcd34d;--warn-soft:rgba(251,191,36,.12);
  --info:#7dd3fc;--info-soft:rgba(56,189,248,.12);
  --track:rgba(255,255,255,.12);--nightband:rgba(148,163,184,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.43;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;border-radius:var(--r1)}
#map{position:fixed;inset:0}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.7);-webkit-backdrop-filter:blur(20px) saturate(1.7);
  border:1px solid var(--hair);box-shadow:var(--sh2);border-radius:var(--r3)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.small{font-size:12px}
.hidden{display:none!important}
.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================================ header */
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:var(--s2);pointer-events:none;z-index:20}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px 0 12px}
.brand .mark{width:32px;height:32px;display:block}
.brand .mark svg{width:32px;height:32px;display:block;filter:drop-shadow(0 2px 6px rgba(10,17,32,.25))}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap}
#modes{display:flex;gap:2px;padding:6px;height:56px;align-items:center;margin:0 auto}
.tab{height:44px;padding:0 14px;border-radius:var(--r2);font-weight:600;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--chip2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--on);color:var(--on-ink)}
.tab kbd{font:600 11px var(--font);opacity:.45;border:1px solid currentColor;border-radius:5px;padding:0 4px;line-height:15px}
.clock{display:flex;align-items:center;gap:var(--s1);padding:6px;height:56px}
.iconbtn{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;color:var(--ink);transition:background .15s}
.iconbtn:hover{background:var(--chip2)}
.iconbtn.on{background:var(--on);color:var(--on-ink)}
.iconbtn svg{width:20px;height:20px}
.time{padding:0 var(--s2);min-width:104px}
.time b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.time small{display:block;font-size:11px;color:var(--ink2);white-space:nowrap}
.speeds{display:flex;background:var(--chip);border-radius:var(--r2);padding:3px;gap:2px}
.speeds button{height:36px;min-width:44px;padding:0 var(--s2);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2)}
.speeds button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:var(--sh1)}
.actions{display:flex;gap:2px;padding:6px;height:56px;align-items:center}

/* ============================================================================ panel */
#panel{position:fixed;top:80px;left:12px;bottom:84px;width:360px;display:flex;flex-direction:column;overflow:hidden;z-index:15}
#panel .head{padding:var(--s4) 20px var(--s2);min-height:104px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.eyebrow svg{width:14px;height:14px}
#panel h2{margin:6px 0 0;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .lede{margin:6px 0 0;color:var(--ink2);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
#panel .body{overflow:auto;padding:var(--s1) 20px 20px;flex:1;scrollbar-width:thin;scrollbar-color:var(--track) transparent}
.sheet-tabs,.handle{display:none}
.sec{margin-top:20px}
.sec>h3,.h3{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 var(--s2);display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.kpi{background:var(--sunk);border:1px solid var(--hair2);border-radius:var(--r2);padding:10px 12px 8px;min-height:96px;display:flex;flex-direction:column;min-width:0}
.kpi.wide{grid-column:span 2;min-height:76px}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:20px}
.kpi-l{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{display:flex;align-items:baseline;gap:4px;margin-top:2px;min-width:0}
.kpi-v .spark{margin-left:auto;align-self:flex-end;margin-bottom:3px}
.kpi-v b{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.kpi-v small{font-size:12px;font-weight:600;color:var(--ink2)}
.kpi-v .sub2{font-size:12px;color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi-f{display:flex;align-items:center;gap:var(--s2);margin-top:auto;padding-top:6px;min-width:0}
.spark{flex:0 1 60px;min-width:32px;height:24px;display:block}
.spark .sa{fill:var(--accent-line);opacity:.14}.spark .sl{fill:none;stroke:var(--accent-line);stroke-width:1.25;vector-effect:non-scaling-stroke}
.spark .sc{fill:var(--ink)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag.sim{color:var(--accent);background:var(--accent-soft)}
.tag.data{color:var(--bike);background:var(--bike-soft)}
.tag.asm{color:var(--ink3);background:var(--chip)}
.delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--rp);white-space:nowrap;opacity:0;transition:opacity .2s}
.delta.on{opacity:1}
.delta.good{color:var(--ok);background:var(--bike-soft)}.delta.bad{color:var(--danger);background:var(--danger-soft)}.delta.neutral{color:var(--ink2);background:var(--chip)}

/* glance */
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.gl{background:var(--sunk);border:1px solid var(--hair2);border-radius:var(--r2);padding:10px 12px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:2px;transition:background .15s}
.gl:hover{background:var(--chip2)}
.gl .gk{font-size:11px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px}
.gl .gk svg{width:14px;height:14px}
.gl b{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gl span.gv{font-size:12px;color:var(--ink2);margin-top:auto}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:var(--s2)}
.barrow{display:grid;grid-template-columns:118px 1fr 52px;gap:var(--s2);align-items:center;font-size:12px;text-align:left;padding:2px 0;border-radius:6px}
.barrow:hover{background:var(--chip)}
.barrow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.barrow .bt{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.barrow .bt i{display:block;height:100%;border-radius:4px;background:var(--bike)}
.barrow .bv{text-align:right;font-weight:600}

/* chips, segments, rows */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px 6px 10px;border-radius:var(--rp);background:var(--chip);font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip svg{width:16px;height:16px}
.chip:hover{background:var(--chip2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.seg{display:flex;background:var(--chip);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2);padding:0 6px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:var(--sh1)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px var(--s3);font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block;flex:none}
.note{font-size:12px;color:var(--ink2);background:var(--sunk);border:1px solid var(--hair2);border-radius:var(--r2);padding:10px 12px;margin-top:var(--s3);line-height:1.5}
.note b{color:var(--ink);font-weight:600}
.link{color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r2);background:var(--sunk);border:1px solid var(--hair2);text-align:left;width:100%;min-height:48px;transition:background .15s}
.row:hover{background:var(--chip2)}
.row .rk{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--raise);box-shadow:var(--sh1);flex:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;font-size:12px;color:var(--ink2)}
.row .val{font-weight:700;font-size:14px;text-align:right}
.row .val small{display:block;font-weight:500;font-size:11px;color:var(--ink3)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r2);background:var(--warn-soft);margin-bottom:6px;font-size:12px;width:100%;text-align:left;align-items:flex-start}
.alert.crit{background:var(--danger-soft)}.alert.info{background:var(--sunk)}
.alert .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--warn);color:#fff}
.alert .ic svg{width:15px;height:15px}
.alert.crit .ic{background:var(--danger)}.alert.info .ic{background:var(--info)}
:root[data-theme="dark"] .alert .ic{color:#0b1220}
.alert b{display:block;font-size:13px;font-weight:600}
.alert span{color:var(--ink2)}
.btn{min-height:44px;padding:0 var(--s4);border-radius:var(--r2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);background:var(--chip);transition:background .15s,filter .15s;white-space:nowrap}
#detail .btn{padding:0 var(--s3)}
.btn:hover{background:var(--chip2)}
.btn.primary{background:var(--on);color:var(--on-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.btns .btn{flex:1}

/* scenarios */
.scn{border-radius:var(--r3);background:var(--sunk);border:1px solid var(--hair2);margin-bottom:var(--s2);overflow:hidden}
.scn>button.sh{width:100%;display:flex;align-items:center;gap:var(--s3);padding:10px 12px;text-align:left;min-height:56px}
.scn>button.sh .n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--raise);box-shadow:var(--sh1);flex:none;color:var(--accent)}
.scn>button.sh .n svg{width:18px;height:18px}
.scn>button.sh b{display:block;font-size:13px;font-weight:600}
.scn>button.sh span{display:block;font-size:12px;color:var(--ink2)}
.scn>button.sh .st{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--bike-soft);color:var(--bike)}
.scn .sb{padding:0 12px 12px}
.scn.open{background:var(--raise);box-shadow:var(--sh1)}
.ba{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair2)}
.ba:last-of-type{border-bottom:0}
.ba .k{font-size:12px;color:var(--ink2)}
.ba .x{font-weight:700;font-size:16px;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.ba .x s{text-decoration:none;color:var(--ink3);font-weight:500;font-size:12px;margin-right:6px}
.ba .x s::after{content:" →"}
.ba .x small{font-size:12px;font-weight:500;color:var(--ink3)}
.ba .d{grid-column:2;font-size:11px;font-weight:700;text-align:right}
.ba .d.good{color:var(--ok)}.ba .d.bad{color:var(--danger)}.ba .d.neutral{color:var(--ink3)}
.rests{font-size:12px;color:var(--ink3);margin-top:10px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.rests svg{width:14px;height:14px;margin-top:2px}
.rests b{color:var(--ink2);font-weight:600}
label.sl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin:var(--s3) 0 2px}
label.sl output{font-weight:700;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent-line);height:32px;margin:0}

/* ============================================================================ detail card */
#detail{position:fixed;top:80px;right:12px;width:360px;max-height:calc(100% - 176px);overflow:auto;z-index:16;padding:var(--s4) var(--s4) var(--s4);scrollbar-width:thin;overscroll-behavior:contain}
#detail .x{position:absolute;top:8px;right:8px}
.kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:44px}
.kind svg{width:15px;height:15px}
#detail h3{margin:8px 40px 2px 0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
#detail h3 .lno{margin-right:8px;vertical-align:1px;height:26px;min-width:34px}
#detail .sub{font-size:12px;color:var(--ink2)}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.badge svg{width:12px;height:12px}
.badge.amber{color:var(--accent);background:var(--accent-soft)}.badge.green{color:var(--bike);background:var(--bike-soft)}
.badge.orange{color:var(--danger);background:var(--danger-soft)}.badge.violet{color:var(--violet);background:var(--violet-soft)}
.lines{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s2)}
.lno{min-width:36px;height:28px;padding:0 8px;border-radius:7px;font-weight:700;font-size:12px;display:inline-grid;place-items:center;color:#fff;letter-spacing:-.01em;flex:none}
button.lno:hover{filter:brightness(1.1)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.fact{background:var(--sunk);border:1px solid var(--hair2);border-radius:10px;padding:8px 10px;min-width:0}
.fact b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact>span{font-size:11px;color:var(--ink2);display:block;line-height:1.35}
.fact.span2{grid-column:span 2}
.sub-h{display:flex;justify-content:space-between;align-items:center;margin:var(--s4) 0 var(--s2)}
.prog{margin-top:var(--s3)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--track)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent-line);width:0}
.pbar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--raise);border:3px solid var(--accent-line);left:0}
.pends{display:flex;justify-content:space-between;gap:var(--s3);font-size:11px;color:var(--ink3);margin-top:6px}
.pends span{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:14px 1fr auto;gap:var(--s2);align-items:center;padding:7px 0;border-bottom:1px solid var(--hair2);font-size:13px}
.nrow:last-child{border-bottom:0}
.nrow i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent-line);background:var(--raise)}
.nrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow b{font-weight:700;font-size:13px}
.board{display:flex;flex-direction:column;border-radius:var(--r2);overflow:hidden;border:1px solid var(--hair2)}

const counters = new Map();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// a number that eases to its new value instead of jumping; a new card counts up from zero once
function count(id, target, d = 0) {
  const el = document.getElementById(id);
  if (!el) return;
  let c = counters.get(id);
  if (!c) { c = { el, cur: reduced ? target : 0, target, d }; counters.set(id, c); el.textContent = fmt(c.cur, d); }
  else if (c.el !== el) { c.el = el; el.textContent = fmt(c.cur, d); }
  c.target = target; c.d = d;
}
function stepCounters(dt) {
  const k = 1 - Math.exp(-dt / 150);
  for (const [id, c] of counters) {
    if (!c.el.isConnected) { const el = document.getElementById(id); if (el) c.el = el; else continue; }
    if (!isFinite(c.target)) { if (c.el.textContent !== '—') c.el.textContent = '—'; continue; }
    if (c.cur === c.target) continue;
    c.cur += (c.target - c.cur) * k;
    if (Math.abs(c.target - c.cur) < 0.5 * 10 ** -c.d) c.cur = c.target;
    const s = fmt(c.cur, c.d);

  }
}

  let d = '';

}

  const mx = Math.max(1e-6, ...arr), key = svcVersion + ':' + mx.toFixed(3);
  if (el.dataset.k !== key) {
    el.dataset.k = key;
    const line = sparkPath(arr, mx);
    el.innerHTML = `<path class="sa" d="${line}L120,28L0,28Z"/><path class="sl" d="${line}"/><circle class="sc" r="2.4"/>`;
  }
  const i = clamp(Math.round(S.t / 10), 0, arr.length - 1), c = el.lastChild;
  c.setAttribute('cx', (i / (arr.length - 1) * 120).toFixed(1)); c.setAttribute('cy', (26 - arr[i] / mx * 22).toFixed(1));
}
function setDelta(id, cur, base, d, unit, better) {
  const el = document.getElementById(id + '-d');
  if (!el) return;
  const diff = cur - base, on = scenarioOn() && Math.abs(diff) >= 0.5 * 10 ** -d;

/* =========================================================================================== full screen */
function toggleFull() {

/* =========================================================================================== keyboard */
document.addEventListener('keydown', e => {

/* =========================================================================================== phone sheet */
function sheetSetup() {
  const panel = $('#panel'), h = $('#panel .handle');
  const sizes = () => [Math.round(innerHeight * 0.3), Math.round(innerHeight * 0.56), Math.round(innerHeight * 0.88)];
  let state = 0;
  const set = i => { state = clamp(i, 0, 2); document.documentElement.style.setProperty('--sheet', sizes()[state] + 'px'); setTimeout(() => { if (map) { map.resize(); padMap(); } }, 400); };
  set(0);
  h.addEventListener('click', () => set((state + 1) % 3));
  h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { set((state + 1) % 3); e.preventDefault(); } });
  let y0 = null, h0 = 0;
  h.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = panel.getBoundingClientRect().height; h.setPointerCapture(e.pointerId); panel.style.transition = 'none'; });
  h.addEventListener('pointermove', e => { if (y0 == null) return; document.documentElement.style.setProperty('--sheet', clamp(h0 + (y0 - e.clientY), 140, innerHeight * 0.92) + 'px'); });
  h.addEventListener('pointerup', e => {

    if (Math.abs(cur - h0) < 6) return;
    set(sz.reduce((bi, v, i) => Math.abs(v - cur) < Math.abs(sz[bi] - cur) ? i : bi, 0));

}

/* =========================================================================================== the loop, quality tiers */
let last = performance.now(), frames = [], tierCooldown = 0, dirty = false;

}
function clockLabel() {

  setT('clockS', `${DATE_LABEL} · ${sun.alt > 0 ? 'sun ' + Math.round(sun.alt) + '°' : 'night'} · simulated`);
}
// MapLibre and luma.gl (under deck) both size the one canvas; luma's resize observer follows its own pixel-ratio

    antialias: S.tier >= 2, pixelRatio: Math.min(devicePixelRatio || 1, [1, 1.5, 2][S.tier]), attributionControl: { compact: true }, fadeDuration: 200,
